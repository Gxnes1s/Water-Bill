<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชี รับ-จ่าย น้ำสวัสดิการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#081327;
    --navy-900:#0C1F3E;
    --navy-800:#132C54;
    --navy-700:#1E3E70;
    --navy-line: rgba(212,175,55,0.18);
    --gold-300:#F2DFA3;
    --gold-400:#E3C574;
    --gold-500:#CDA43B;
    --gold-600:#A9822A;
    --paper:#FBF8F0;
    --paper-line:#E7DEC4;
    --card:#FFFFFF;
    --ink:#16233A;
    --ink-soft:#5B6B80;
    --ink-faint:#8A97A8;
    --credit:#2F6B4F;
    --credit-soft:#E4EFE7;
    --debit:#9A4B33;
    --debit-soft:#F3E5DD;
    --radius-lg:16px;
    --radius-md:10px;
    --shadow-card: 0 10px 30px -18px rgba(8,19,39,0.35), 0 1px 2px rgba(8,19,39,0.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Thai', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-400);color:var(--navy-950);}
  :focus-visible{outline:2px solid var(--gold-500);outline-offset:2px;}

  /* ---------- Header ---------- */
  header{
    position:relative;
    background:
      radial-gradient(1100px 420px at 15% -20%, rgba(227,197,116,0.12), transparent 60%),
      linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-800) 100%);
    color:var(--paper);
    padding:40px 28px 30px;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--gold-500) 18%, var(--gold-300) 50%, var(--gold-500) 82%, transparent);
  }
  .header-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:flex-start;
    gap:16px;
    max-width:620px;
  }
  .brand-mark{
    flex:none;
    width:46px;height:46px;
    border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(155deg, rgba(227,197,116,0.16), rgba(227,197,116,0.02));
    border:1.5px solid var(--gold-500);
    margin-top:4px;
  }
  .brand-mark svg{width:24px;height:24px;}
  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.03em;
    color:var(--gold-300);
    margin:0 0 6px;
    font-weight:600;
  }
  h1{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:clamp(24px,3.6vw,34px);
    margin:0 0 6px;
    color:#FCF9EF;
    line-height:1.3;
  }
  .subtitle{
    font-size:14.5px;
    color:rgba(251,248,240,0.62);
    margin:0;
    max-width:52ch;
  }
  .stock-plate{
    background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid var(--gold-500);
    border-radius:var(--radius-md);
    padding:14px 22px;
    text-align:right;
    min-width:190px;
  }
  .stock-plate .label{
    font-size:11.5px;
    color:var(--gold-300);
    display:block;
    margin-bottom:6px;
    font-weight:600;
  }
  .stock-plate .value{
    font-family:'Noto Serif Thai', serif;
    font-size:26px;
    font-weight:700;
    line-height:1.2;
    color:#FCF9EF;
  }

  main{max-width:1100px;margin:0 auto;padding:26px 24px 40px;}

  /* ---------- Size tabs ---------- */
  .size-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .size-tabs .tab{
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Noto Serif Thai', serif;
    font-weight:600;
    font-size:14.5px;
    padding:10px 20px;
    border:1px solid var(--paper-line);
    border-radius:999px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .size-tabs .tab.active{
    background:var(--navy-900);
    color:var(--gold-300);
    border-color:var(--navy-900);
  }
  .size-tabs .tab:not(.active):hover{
    border-color:var(--gold-500);
    color:var(--navy-900);
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:14px;
    flex-wrap:wrap;
  }
  .status{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .status::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ink-faint);
    flex:none;
  }
  .status.ok::before{background:var(--credit);}
  .status.err{color:var(--debit);}
  .status.err::before{background:var(--debit);}

  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-add{
    background:linear-gradient(160deg, var(--gold-400), var(--gold-600));
    color:var(--navy-950);
    padding:11px 22px;
    font-size:14.5px;
    font-weight:700;
    border-radius:999px;
    box-shadow:0 6px 16px -8px rgba(169,130,42,0.7);
  }
  .btn-add:hover{filter:brightness(1.05);}
  .btn-add:active{transform:translateY(1px);}

  /* ---------- Form ---------- */
  form.entry-form{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-left:4px solid var(--gold-500);
    border-radius:var(--radius-lg);
    padding:22px;
    margin-bottom:22px;
    display:none;
    grid-template-columns:1fr 1fr;
    gap:16px;
    box-shadow:var(--shadow-card);
  }
  form.entry-form.open{display:grid;}
  form.entry-form.editing{border-left-color:var(--debit);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .field input, .field textarea, .field select{
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius-md);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;border-color:var(--gold-500);
    box-shadow:0 0 0 3px rgba(205,164,59,0.18);
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:38px;font-family:inherit;}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:2px;}
  .btn-save{background:linear-gradient(160deg, var(--navy-800), var(--navy-950));color:var(--gold-300);padding:11px 24px;border-radius:999px;font-weight:700;font-size:14.5px;}
  .btn-save:hover{filter:brightness(1.15);}
  .btn-cancel{background:transparent;color:var(--ink-soft);padding:11px 16px;font-size:14.5px;border-radius:999px;}
  .btn-cancel:hover{color:var(--ink);background:var(--paper);}
  #remainPreview{
    padding:10px 12px;background:var(--paper);border:1px dashed var(--gold-500);
    border-radius:var(--radius-md);font-weight:700;color:var(--navy-900);
  }

  /* ---------- Table ---------- */
  .table-wrap{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  thead th{
    font-family:'Noto Serif Thai', serif;
    background:linear-gradient(160deg, var(--navy-900), var(--navy-800));
    color:var(--gold-300);
    font-weight:600;
    font-size:14px;
    text-align:left;
    padding:13px 16px;
  }
  thead th.num{text-align:right;}
  tbody td{
    padding:12px 16px;
    border-bottom:1px solid var(--paper-line);
    font-size:14.5px;
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:#FCFAF2;}
  tbody tr.received td.received-cell{color:var(--credit);font-weight:600;}
  tbody tr td.withdrawn-cell:not(:empty){color:var(--debit);font-weight:600;}
  td.remaining{font-weight:700;color:var(--navy-900);}
  td.item{max-width:260px;}
  td.item .note{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  td.actions{white-space:nowrap;text-align:right;}
  .icon-btn{
    background:transparent;
    padding:6px 10px;
    font-size:13px;
    color:var(--ink-soft);
    border-radius:999px;
    font-weight:600;
  }
  .icon-btn.edit:hover{background:var(--navy-900);color:var(--gold-300);}
  .icon-btn.del:hover{background:var(--debit-soft);color:var(--debit);}
  .empty-row td{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  footer{
    max-width:1100px;
    margin:0 auto;
    padding:16px 24px 44px;
    font-size:12.5px;
    color:var(--ink-faint);
    text-align:center;
  }

  /* ---------- Responsive: card-table for small screens ---------- */
  @media (max-width:700px){
    header{padding:28px 18px 22px;}
    .header-inner{align-items:stretch;}
    .stock-plate{text-align:left;width:100%;}
    main{padding:18px 14px 32px;}
    form.entry-form{grid-template-columns:1fr;padding:18px;}
    .size-tabs{overflow-x:auto;padding-bottom:2px;}

    .table-wrap{border-radius:var(--radius-md);}
    table{min-width:0;}
    thead{display:none;}
    tbody, tr, td{display:block;width:100%;}
    tbody tr{
      padding:14px 16px;
      border-bottom:8px solid var(--paper);
    }
    tbody tr:last-child{border-bottom:none;}
    tbody td{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      text-align:right;
      padding:7px 0;
      border-bottom:1px dashed var(--paper-line);
    }
    tbody td:last-of-type{border-bottom:none;}
    tbody td::before{
      content:attr(data-label);
      font-weight:600;
      color:var(--ink-soft);
      text-align:left;
      flex:0 0 auto;
    }
    td.item{max-width:none;}
    td.actions{justify-content:flex-end;gap:6px;padding-top:10px;}
    td.actions::before{content:none;}
    .icon-btn{padding:7px 12px;background:var(--paper);}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3C12 3 5.5 10.6 5.5 15.2C5.5 18.7 8.4 21 12 21C15.6 21 18.5 18.7 18.5 15.2C18.5 10.6 12 3 12 3Z" stroke="#E3C574" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </span>
      <div class="title-block">
        <p class="eyebrow">แผนกสวัสดิการ</p>
        <h1>บัญชี รับ – จ่าย น้ำดื่มสวัสดิการ</h1>
        <p class="subtitle" id="subtitleText">บันทึกและติดตามยอดคงเหลือแบบเรียลไทม์</p>
      </div>
    </div>
    <div class="stock-plate">
      <span class="label" id="stockLabel">คงเหลือ 350 มล.</span>
      <span class="value" id="latestStock">–</span>
    </div>
  </div>
</header>

<main>
  <nav class="size-tabs" id="sizeTabs">
    <button type="button" class="tab active" data-size="350">ขนาด 350 มล.</button>
    <button type="button" class="tab" data-size="600">ขนาด 600 มล.</button>
  </nav>

  <div class="toolbar">
    <button class="btn-add" id="toggleFormBtn" type="button">+ เพิ่มรายการ</button>
    <span class="status" id="statusText">กำลังเชื่อมต่อฐานข้อมูล…</span>
  </div>

  <form class="entry-form" id="entryForm">
    <div class="field">
      <label for="f-date">วัน/เดือน/ปี</label>
      <input type="text" id="f-date" placeholder="เช่น 29/5/26">
    </div>
    <div class="field">
      <label for="f-item">รายการ</label>
      <input type="text" id="f-item" placeholder="เช่น น้ำมาส่ง, เบิกใช้">
    </div>
    <div class="field">
      <label for="f-in">รับ</label>
      <input type="number" id="f-in" placeholder="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="f-out">เบิก</label>
      <input type="number" id="f-out" placeholder="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="f-unit">หน่วย</label>
      <select id="f-unit">
        <option value="แพ็ค">แพ็ค</option>
        <option value="ขวด">ขวด</option>
      </select>
    </div>
    <div class="field full" id="previewField">
      <label>คงเหลือ (คำนวณอัตโนมัติ)</label>
      <div id="remainPreview">0</div>
    </div>
    <div class="field">
      <label for="f-note">หมายเหตุ</label>
      <input type="text" id="f-note" placeholder="เช่น เลขที่เอกสาร, ผู้เบิก">
    </div>
    <div class="form-actions">
      <button type="button" class="btn-cancel" id="cancelBtn">ยกเลิก</button>
      <button type="submit" class="btn-save" id="saveBtn">บันทึกรายการ</button>
    </div>
  </form>

  <div class="table-wrap">
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th style="width:100px;">วัน/ด/ป</th>
          <th>รายการ</th>
          <th class="num">รับ</th>
          <th class="num">เบิก</th>
          <th class="num">คงเหลือ</th>
          <th>หมายเหตุ</th>
          <th style="width:90px;">จัดการ</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="7">ยังไม่มีรายการ</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</main>

<footer>
  ข้อมูลนี้ซิงก์แบบเรียลไทม์ผ่าน Firebase — ทุกคนที่เปิดหน้านี้จะเห็นการเปลี่ยนแปลงทันที
</footer>

<!-- Firebase (compat SDK, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";

  const tableBody = document.getElementById('tableBody');
  const statusText = document.getElementById('statusText');
  const latestStock = document.getElementById('latestStock');
  const stockLabel = document.getElementById('stockLabel');
  const subtitleText = document.getElementById('subtitleText');
  const sizeTabs = document.getElementById('sizeTabs');
  const form = document.getElementById('entryForm');
  const toggleFormBtn = document.getElementById('toggleFormBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const fDate = document.getElementById('f-date');
  const fItem = document.getElementById('f-item');
  const fIn = document.getElementById('f-in');
  const fOut = document.getElementById('f-out');
  const fUnit = document.getElementById('f-unit');
  const fNote = document.getElementById('f-note');
  const remainPreview = document.getElementById('remainPreview');

  let activeSize = '350';
  let editingId = null;
  let allEntries = [];
  let nextOrder = {}; // per-size counter, e.g. {350: 5, 600: 2}

  const BOTTLES_PER_PACK = 12; // 1 แพ็ค = 12 ขวด

  function num(v){
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function toBottles(amount, unit){
    return num(amount) * (unit === 'แพ็ค' ? BOTTLES_PER_PACK : 1);
  }

  // Formats a total bottle count as "X แพ็ค Y ขวด" (12 ขวด = 1 แพ็ค), combined into one figure.
  function formatBottles(totalBottles){
    const sign = totalBottles < 0 ? '-' : '';
    const abs = Math.round(Math.abs(totalBottles) * 100) / 100;
    const packs = Math.floor(abs / BOTTLES_PER_PACK);
    const bottles = Math.round((abs - packs * BOTTLES_PER_PACK) * 100) / 100;
    const parts = [];
    if (packs) parts.push(`${packs.toLocaleString('th-TH')} แพ็ค`);
    if (bottles || !packs) parts.push(`${bottles.toLocaleString('th-TH')} ขวด`);
    return sign + parts.join(' ');
  }

  // Chronological (oldest -> newest) list for the active size, with a single running
  // balance in bottles — รับ/เบิก entered as แพ็ค are converted (×12) before adding,
  // so คงเหลือ is always one combined figure (e.g. "2 แพ็ค 3 ขวด").
  function chronologicalEntries(){
    let runningBottles = 0;
    const list = allEntries
      .filter(e => (e.size || '350') === activeSize)
      .map(e => {
        const unit = e.unit || 'แพ็ค';
        runningBottles += toBottles(e.received, unit) - toBottles(e.withdrawn, unit);
        return { ...e, remainingBottles: runningBottles };
      });
    return { list, finalBottles: runningBottles };
  }

  // Newest-first list for display
  function visibleEntries(){
    return chronologicalEntries().list.slice().reverse();
  }

  function baseBeforeIndex(ascList, idx){
    return idx > 0 ? ascList[idx - 1].remainingBottles : 0;
  }

  // ---- Form open/close: this must always work, independent of Firebase status ----
  function openForm(editing){
    form.classList.add('open');
    form.classList.toggle('editing', !!editing);
    toggleFormBtn.style.display = 'none';
    updatePreview();
    fDate.focus();
  }
  function closeForm(){
    form.classList.remove('open','editing');
    form.reset();
    editingId = null;
    toggleFormBtn.style.display = '';
    updatePreview();
  }
  function updatePreview(){
    const { list } = chronologicalEntries();
    const unit = fUnit.value || 'แพ็ค';
    const idx = editingId ? list.findIndex(x => x.id === editingId) : list.length;
    const base = baseBeforeIndex(list, idx === -1 ? list.length : idx);
    const preview = base + toBottles(fIn.value, unit) - toBottles(fOut.value, unit);
    remainPreview.textContent = formatBottles(preview);
  }

  toggleFormBtn.addEventListener('click', () => openForm(false));
  cancelBtn.addEventListener('click', closeForm);
  fIn.addEventListener('input', updatePreview);
  fOut.addEventListener('input', updatePreview);
  fUnit.addEventListener('change', updatePreview);

  sizeTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activeSize = btn.getAttribute('data-size');
    [...sizeTabs.querySelectorAll('.tab')].forEach(t => t.classList.toggle('active', t === btn));
    stockLabel.textContent = `คงเหลือ ${activeSize} มล.`;
    subtitleText.textContent = `ขนาดขวด ${activeSize} มล. — บันทึกและติดตามยอดคงเหลือแบบเรียลไทม์`;
    closeForm();
    render();
  });

  function esc(s){
    return (String(s === undefined || s === null ? '' : s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    const entries = visibleEntries();
    if (!entries.length){
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="7">ยังไม่มีรายการสำหรับขนาด ${activeSize} มล. — กด "เพิ่มรายการ" เพื่อเริ่มบันทึก</td></tr>`;
      latestStock.textContent = formatBottles(0);
      return;
    }
    tableBody.innerHTML = entries.map((e) => {
      const unit = e.unit || 'แพ็ค';
      return `
      <tr class="${num(e.received) > 0 ? 'received' : ''}">
        <td data-label="วัน/ด/ป">${esc(e.date)}</td>
        <td class="item" data-label="รายการ">${esc(e.item)}</td>
        <td class="num received-cell" data-label="รับ">${num(e.received) ? num(e.received).toLocaleString('th-TH') + ' ' + esc(unit) : ''}</td>
        <td class="num withdrawn-cell" data-label="เบิก">${num(e.withdrawn) ? num(e.withdrawn).toLocaleString('th-TH') + ' ' + esc(unit) : ''}</td>
        <td class="num remaining" data-label="คงเหลือ">${formatBottles(e.remainingBottles)}</td>
        <td data-label="หมายเหตุ">${esc(e.note)}</td>
        <td class="actions">
          <button class="icon-btn edit" data-edit="${e.id}">แก้ไข</button>
          <button class="icon-btn del" data-del="${e.id}">ลบ</button>
        </td>
      </tr>
    `;
    }).join('');

    const { finalBottles } = chronologicalEntries();
    latestStock.textContent = formatBottles(finalBottles);
  }

  tableBody.addEventListener('click', (e) => {
    const editId = e.target.getAttribute('data-edit');
    const delId = e.target.getAttribute('data-del');
    if (editId) editEntry(editId);
    if (delId) deleteEntry(delId);
  });

  function editEntry(id){
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    fDate.value = e.date || '';
    fItem.value = e.item || '';
    fIn.value = e.received || '';
    fOut.value = e.withdrawn || '';
    fUnit.value = e.unit || 'แพ็ค';
    fNote.value = e.note || '';
    openForm(true);
  }

  // ---- Firebase wiring: guarded so a config/connection problem never disables the form UI above ----
  let col = null;
  let db = null;

  if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey) {
    statusText.textContent = 'ยังไม่ได้ตั้งค่า Firebase — ดู README.md (ไฟล์ firebase-config.js หายไปหรือยังไม่มีค่า)';
    statusText.classList.add('err');
  } else {
    try{
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.firestore();
      col = db.collection('WaterBill');

      col.orderBy('order', 'asc').onSnapshot((snap) => {
        allEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        nextOrder = {};
        allEntries.forEach(e => {
          const s = e.size || '350';
          nextOrder[s] = Math.max(nextOrder[s] || 0, e.order || 0) + 1;
        });
        statusText.textContent = 'เชื่อมต่อแล้ว • อัปเดตล่าสุดแบบเรียลไทม์';
        statusText.classList.remove('err');
        statusText.classList.add('ok');
        render();
        if (form.classList.contains('open')) updatePreview();
      }, (err) => {
        console.error(err);
        statusText.classList.remove('ok');
        if (err.code === 'permission-denied'){
          statusText.textContent = 'เชื่อมต่อไม่สำเร็จ: ยังไม่ได้ตั้งค่า Firestore Rules ให้ allow read/write (ดูขั้นตอนใน README.md)';
        } else {
          statusText.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + err.message;
        }
        statusText.classList.add('err');
      });
    } catch(err){
      console.error(err);
      statusText.textContent = 'ตั้งค่า Firebase ไม่สำเร็จ: ' + err.message;
      statusText.classList.add('err');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!col){
      statusText.textContent = 'ยังเชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบ firebase-config.js และ Firestore Rules ก่อน (ดู README.md)';
      statusText.classList.remove('ok');
      statusText.classList.add('err');
      return;
    }
    const item = fItem.value.trim();
    if (!item) { fItem.focus(); return; }

    const data = {
      date: fDate.value.trim(),
      item: item,
      received: fIn.value === '' ? 0 : num(fIn.value),
      withdrawn: fOut.value === '' ? 0 : num(fOut.value),
      unit: fUnit.value || 'แพ็ค',
      note: fNote.value.trim(),
    };

    statusText.textContent = 'กำลังบันทึก…';
    statusText.classList.remove('err');
    try{
      if (editingId){
        await col.doc(editingId).update(data);
      } else {
        data.size = activeSize;
        data.order = nextOrder[activeSize] || 1;
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await col.add(data);
      }
      closeForm();
    } catch(err){
      console.error(err);
      if (err.code === 'permission-denied'){
        statusText.textContent = 'บันทึกไม่สำเร็จ: Firestore Rules ยังไม่อนุญาตให้เขียนข้อมูล (ดู README.md)';
      } else {
        statusText.textContent = 'บันทึกไม่สำเร็จ: ' + err.message;
      }
      statusText.classList.add('err');
    }
  });

  async function deleteEntry(id){
    if (!col) return;
    if (!confirm('ลบรายการนี้หรือไม่?')) return;
    try{
      await col.doc(id).delete();
    } catch(err){
      statusText.textContent = 'ลบไม่สำเร็จ: ' + err.message;
      statusText.classList.add('err');
    }
  }

})();
</script>
</body>
</html>
