<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชี รับ-จ่าย น้ำสวัสดิการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E6;
    --paper-line:#DCD2B8;
    --ink:#26364B;
    --ink-soft:#5B6B7E;
    --ink-deep:#16222F;
    --seal:#A6402F;
    --seal-soft:#E7CFC6;
    --stamp:#3C6E63;
    --stamp-soft:#D6E4DE;
    --card:#FFFDF8;
    --shadow: 0 1px 0 rgba(38,54,75,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Noto Sans Thai', sans-serif;
    min-height:100vh;
  }
  header{
    padding:36px 24px 20px;
    max-width:1080px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:2px solid var(--ink-deep);
  }
  .title-block{max-width:640px;}
  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  h1{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:clamp(26px,4vw,36px);
    margin:0 0 4px;
    color:var(--ink-deep);
    line-height:1.25;
  }
  .subtitle{
    font-size:15px;
    color:var(--ink-soft);
    margin:0;
  }
  .stock-plate{
    background:var(--ink-deep);
    color:var(--paper);
    padding:16px 26px;
    text-align:right;
    min-width:200px;
    position:relative;
  }
  .stock-plate::before{
    content:"";
    position:absolute;
    top:6px; left:6px; right:6px; bottom:6px;
    border:1px solid rgba(246,241,230,0.35);
    pointer-events:none;
  }
  .stock-plate .label{
    font-size:12px;
    color:#C9D3DC;
    display:block;
    margin-bottom:4px;
  }
  .stock-plate .value{
    font-family:'Noto Serif Thai', serif;
    font-size:30px;
    font-weight:700;
    line-height:1;
  }

  main{max-width:1080px;margin:0 auto;padding:24px;}

  .size-tabs{
    display:flex;
    gap:2px;
    margin-bottom:18px;
    border-bottom:2px solid var(--ink-deep);
  }
  .size-tabs .tab{
    background:transparent;
    color:var(--ink-soft);
    font-family:'Noto Serif Thai', serif;
    font-weight:600;
    font-size:15.5px;
    padding:10px 22px;
    border:1px solid var(--paper-line);
    border-bottom:none;
    border-radius:2px 2px 0 0;
    position:relative;
    top:2px;
  }
  .size-tabs .tab.active{
    background:var(--ink-deep);
    color:var(--paper);
    border-color:var(--ink-deep);
  }
  .size-tabs .tab:not(.active):hover{
    background:var(--stamp-soft);
    color:var(--stamp);
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:12px;
    flex-wrap:wrap;
  }
  .status{
    font-size:13px;
    color:var(--ink-soft);
  }
  .status.err{color:var(--seal);}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-add{
    background:var(--stamp);
    color:#fff;
    padding:11px 20px;
    font-size:15px;
    font-weight:600;
    border-radius:2px;
    box-shadow:var(--shadow);
  }
  .btn-add:hover{background:#325a51;}

  form.entry-form{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-left:4px solid var(--stamp);
    padding:20px;
    margin-bottom:20px;
    display:none;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  form.entry-form.open{display:grid;}
  form.entry-form.editing{border-left-color:var(--seal);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .field input, .field textarea, .field select{
    font-family:inherit;
    font-size:15px;
    padding:9px 10px;
    border:1px solid #C9BE9F;
    background:#fff;
    color:var(--ink-deep);
    border-radius:2px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--stamp);outline-offset:0;border-color:var(--stamp);}
  .field textarea{resize:vertical;min-height:38px;font-family:inherit;}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
  .btn-save{background:var(--ink-deep);color:#fff;padding:10px 22px;border-radius:2px;font-weight:600;font-size:14.5px;}
  .btn-save:hover{background:#0e1822;}
  .btn-cancel{background:transparent;color:var(--ink-soft);padding:10px 16px;font-size:14.5px;}
  .btn-cancel:hover{color:var(--ink-deep);}

  .table-wrap{
    background:var(--card);
    border:1px solid var(--paper-line);
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;min-width:820px;}
  thead th{
    font-family:'Noto Serif Thai', serif;
    background:var(--ink-deep);
    color:var(--paper);
    font-weight:600;
    font-size:14.5px;
    text-align:left;
    padding:12px 14px;
    position:sticky;
    top:0;
  }
  thead th.num{text-align:right;}
  tbody td{
    padding:11px 14px;
    border-bottom:1px solid var(--paper-line);
    font-size:14.5px;
    vertical-align:top;
  }
  tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:#FBF7EC;}
  tbody tr.received td.remaining{color:var(--stamp);font-weight:600;}
  td.item{max-width:260px;}
  td.item .note{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  td.actions{white-space:nowrap;text-align:right;}
  .icon-btn{
    background:transparent;
    padding:5px 8px;
    font-size:13px;
    color:var(--ink-soft);
    border-radius:2px;
  }
  .icon-btn:hover{background:var(--stamp-soft);color:var(--stamp);}
  .icon-btn.del:hover{background:var(--seal-soft);color:var(--seal);}
  .icon-btn.move{color:var(--ink-soft);}
  .empty-row td{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  footer{
    max-width:1080px;
    margin:0 auto;
    padding:14px 24px 40px;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  @media (max-width:600px){
    header{padding:24px 16px 16px;}
    main{padding:16px;}
    form.entry-form{grid-template-columns:1fr;padding:16px;}
    .stock-plate{text-align:left;width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <p class="eyebrow">แผนกสวัสดิการ</p>
    <h1>บัญชี รับ – จ่าย น้ำดื่มสวัสดิการ</h1>
    <p class="subtitle" id="subtitleText">บันทึกและติดตามยอดคงเหลือแบบเรียลไทม์</p>
  </div>
  <div class="stock-plate">
    <span class="label" id="stockLabel">คงเหลือ 350 มล.</span>
    <span class="value" id="latestStock">–</span>
  </div>
</header>

<main>
  <nav class="size-tabs" id="sizeTabs">
    <button type="button" class="tab active" data-size="350">ขนาด 350 มล.</button>
    <button type="button" class="tab" data-size="600">ขนาด 600 มล.</button>
  </nav>

  <div class="toolbar">
    <button class="btn-add" id="toggleFormBtn" type="button">+ เพิ่มรายการ</button>
    <span class="status" id="statusText">กำลังเชื่อมต่อฐานข้อมูล…</span>
  </div>

  <form class="entry-form" id="entryForm">
    <div class="field">
      <label for="f-date">วัน/เดือน/ปี</label>
      <input type="text" id="f-date" placeholder="เช่น 29/5/26">
    </div>
    <div class="field">
      <label for="f-item">รายการ</label>
      <input type="text" id="f-item" placeholder="เช่น น้ำมาส่ง, เบิกใช้">
    </div>
    <div class="field">
      <label for="f-in">รับ</label>
      <input type="number" id="f-in" placeholder="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="f-out">เบิก</label>
      <input type="number" id="f-out" placeholder="0" min="0" step="1">
    </div>
    <div class="field">
      <label for="f-unit">หน่วย</label>
      <select id="f-unit">
        <option value="แพ็ค">แพ็ค</option>
        <option value="ขวด">ขวด</option>
      </select>
    </div>
    <div class="field full" id="previewField">
      <label>คงเหลือ (คำนวณอัตโนมัติ)</label>
      <div id="remainPreview" style="padding:9px 10px;background:#F1ECDD;border:1px dashed #C9BE9F;font-weight:700;color:var(--ink-deep);">0</div>
    </div>
    <div class="field">
      <label for="f-note">หมายเหตุ</label>
      <input type="text" id="f-note" placeholder="เช่น เลขที่เอกสาร, ผู้เบิก">
    </div>
    <div class="form-actions">
      <button type="button" class="btn-cancel" id="cancelBtn">ยกเลิก</button>
      <button type="submit" class="btn-save" id="saveBtn">บันทึกรายการ</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:36px;"></th>
          <th style="width:100px;">วัน/ด/ป</th>
          <th>รายการ</th>
          <th class="num">รับ</th>
          <th class="num">เบิก</th>
          <th class="num">คงเหลือ</th>
          <th>หมายเหตุ</th>
          <th style="width:90px;">จัดการ</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="8">ยังไม่มีรายการ</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  ข้อมูลนี้ซิงก์แบบเรียลไทม์ผ่าน Firebase — ทุกคนที่เปิดหน้านี้จะเห็นการเปลี่ยนแปลงทันที
</footer>

<!-- Firebase (compat SDK, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";

  const tableBody = document.getElementById('tableBody');
  const statusText = document.getElementById('statusText');
  const latestStock = document.getElementById('latestStock');
  const stockLabel = document.getElementById('stockLabel');
  const subtitleText = document.getElementById('subtitleText');
  const sizeTabs = document.getElementById('sizeTabs');
  const form = document.getElementById('entryForm');
  const toggleFormBtn = document.getElementById('toggleFormBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const fDate = document.getElementById('f-date');
  const fItem = document.getElementById('f-item');
  const fIn = document.getElementById('f-in');
  const fOut = document.getElementById('f-out');
  const fUnit = document.getElementById('f-unit');
  const fNote = document.getElementById('f-note');
  const remainPreview = document.getElementById('remainPreview');

  let activeSize = '350';
  let editingId = null;
  let allEntries = [];
  let nextOrder = {}; // per-size counter, e.g. {350: 5, 600: 2}

  function num(v){
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  // Chronological (oldest -> newest) list for the active size, with a running balance
  // tracked SEPARATELY per unit (แพ็ค / ขวด), since the two units aren't interchangeable
  // without a conversion factor.
  function chronologicalEntries(){
    const running = { 'แพ็ค': 0, 'ขวด': 0 };
    const list = allEntries
      .filter(e => (e.size || '350') === activeSize)
      .map(e => {
        const unit = e.unit || 'แพ็ค';
        running[unit] = running[unit] + num(e.received) - num(e.withdrawn);
        return { ...e, remaining: running[unit], remainingUnit: unit };
      });
    return { list, finalRunning: running };
  }

  // Newest-first list for display
  function visibleEntries(){
    return chronologicalEntries().list.slice().reverse();
  }

  function baseBeforeIndex(ascList, idx, unit){
    for (let i = idx - 1; i >= 0; i--){
      if ((ascList[i].unit || 'แพ็ค') === unit) return ascList[i].remaining;
    }
    return 0;
  }

  // ---- Form open/close: this must always work, independent of Firebase status ----
  function openForm(editing){
    form.classList.add('open');
    form.classList.toggle('editing', !!editing);
    toggleFormBtn.style.display = 'none';
    updatePreview();
    fDate.focus();
  }
  function closeForm(){
    form.classList.remove('open','editing');
    form.reset();
    editingId = null;
    toggleFormBtn.style.display = '';
    updatePreview();
  }
  function updatePreview(){
    const { list } = chronologicalEntries();
    const unit = fUnit.value || 'แพ็ค';
    const idx = editingId ? list.findIndex(x => x.id === editingId) : list.length;
    const base = baseBeforeIndex(list, idx === -1 ? list.length : idx, unit);
    const preview = base + num(fIn.value) - num(fOut.value);
    remainPreview.textContent = `${preview.toLocaleString('th-TH')} ${unit}`;
  }

  toggleFormBtn.addEventListener('click', () => openForm(false));
  cancelBtn.addEventListener('click', closeForm);
  fIn.addEventListener('input', updatePreview);
  fOut.addEventListener('input', updatePreview);
  fUnit.addEventListener('change', updatePreview);

  sizeTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activeSize = btn.getAttribute('data-size');
    [...sizeTabs.querySelectorAll('.tab')].forEach(t => t.classList.toggle('active', t === btn));
    stockLabel.textContent = `คงเหลือ ${activeSize} มล.`;
    subtitleText.textContent = `ขนาดขวด ${activeSize} มล. — บันทึกและติดตามยอดคงเหลือแบบเรียลไทม์`;
    closeForm();
    render();
  });

  function esc(s){
    return (String(s === undefined || s === null ? '' : s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    const entries = visibleEntries();
    if (!entries.length){
      tableBody.innerHTML = `<tr class="empty-row"><td colspan="8">ยังไม่มีรายการสำหรับขนาด ${activeSize} มล. — กด "เพิ่มรายการ" เพื่อเริ่มบันทึก</td></tr>`;
      latestStock.textContent = '0';
      return;
    }
    tableBody.innerHTML = entries.map((e, i) => {
      const unit = e.remainingUnit;
      return `
      <tr class="${num(e.received) > 0 ? 'received' : ''}">
        <td class="actions" style="text-align:left;">
          <button class="icon-btn move" title="เลื่อนขึ้น" data-move="-1" data-id="${e.id}" ${i===0?'disabled style="opacity:.3"':''}>↑</button
          ><button class="icon-btn move" title="เลื่อนลง" data-move="1" data-id="${e.id}" ${i===entries.length-1?'disabled style="opacity:.3"':''}>↓</button>
        </td>
        <td>${esc(e.date)}</td>
        <td class="item">${esc(e.item)}</td>
        <td class="num">${num(e.received) ? num(e.received).toLocaleString('th-TH') + ' ' + esc(unit) : ''}</td>
        <td class="num">${num(e.withdrawn) ? num(e.withdrawn).toLocaleString('th-TH') + ' ' + esc(unit) : ''}</td>
        <td class="num remaining">${e.remaining.toLocaleString('th-TH')} ${esc(unit)}</td>
        <td>${esc(e.note)}</td>
        <td class="actions">
          <button class="icon-btn edit" data-edit="${e.id}">แก้ไข</button>
          <button class="icon-btn del" data-del="${e.id}">ลบ</button>
        </td>
      </tr>
    `;
    }).join('');

    const { finalRunning } = chronologicalEntries();
    const parts = [];
    if (finalRunning['แพ็ค']) parts.push(`${finalRunning['แพ็ค'].toLocaleString('th-TH')} แพ็ค`);
    if (finalRunning['ขวด']) parts.push(`${finalRunning['ขวด'].toLocaleString('th-TH')} ขวด`);
    latestStock.textContent = parts.length ? parts.join(' / ') : '0';
  }

  tableBody.addEventListener('click', (e) => {
    const editId = e.target.getAttribute('data-edit');
    const delId = e.target.getAttribute('data-del');
    const moveId = e.target.getAttribute('data-id');
    if (editId) editEntry(editId);
    if (delId) deleteEntry(delId);
    if (moveId) move(moveId, parseInt(e.target.getAttribute('data-move'), 10));
  });

  function editEntry(id){
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    fDate.value = e.date || '';
    fItem.value = e.item || '';
    fIn.value = e.received || '';
    fOut.value = e.withdrawn || '';
    fUnit.value = e.unit || 'แพ็ค';
    fNote.value = e.note || '';
    openForm(true);
  }

  // ---- Firebase wiring: guarded so a config/connection problem never disables the form UI above ----
  let col = null;
  let db = null;

  if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey) {
    statusText.textContent = 'ยังไม่ได้ตั้งค่า Firebase — ดู README.md (ไฟล์ firebase-config.js หายไปหรือยังไม่มีค่า)';
    statusText.classList.add('err');
  } else {
    try{
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.firestore();
      col = db.collection('WaterBill');

      col.orderBy('order', 'asc').onSnapshot((snap) => {
        allEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        nextOrder = {};
        allEntries.forEach(e => {
          const s = e.size || '350';
          nextOrder[s] = Math.max(nextOrder[s] || 0, e.order || 0) + 1;
        });
        statusText.textContent = 'เชื่อมต่อแล้ว • อัปเดตล่าสุดแบบเรียลไทม์';
        statusText.classList.remove('err');
        render();
        if (form.classList.contains('open')) updatePreview();
      }, (err) => {
        console.error(err);
        if (err.code === 'permission-denied'){
          statusText.textContent = 'เชื่อมต่อไม่สำเร็จ: ยังไม่ได้ตั้งค่า Firestore Rules ให้ allow read/write (ดูขั้นตอนใน README.md)';
        } else {
          statusText.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + err.message;
        }
        statusText.classList.add('err');
      });
    } catch(err){
      console.error(err);
      statusText.textContent = 'ตั้งค่า Firebase ไม่สำเร็จ: ' + err.message;
      statusText.classList.add('err');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!col){
      statusText.textContent = 'ยังเชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบ firebase-config.js และ Firestore Rules ก่อน (ดู README.md)';
      statusText.classList.add('err');
      return;
    }
    const item = fItem.value.trim();
    if (!item) { fItem.focus(); return; }

    const data = {
      date: fDate.value.trim(),
      item: item,
      received: fIn.value === '' ? 0 : num(fIn.value),
      withdrawn: fOut.value === '' ? 0 : num(fOut.value),
      unit: fUnit.value || 'แพ็ค',
      note: fNote.value.trim(),
    };

    statusText.textContent = 'กำลังบันทึก…';
    statusText.classList.remove('err');
    try{
      if (editingId){
        await col.doc(editingId).update(data);
      } else {
        data.size = activeSize;
        data.order = nextOrder[activeSize] || 1;
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await col.add(data);
      }
      closeForm();
    } catch(err){
      console.error(err);
      if (err.code === 'permission-denied'){
        statusText.textContent = 'บันทึกไม่สำเร็จ: Firestore Rules ยังไม่อนุญาตให้เขียนข้อมูล (ดู README.md)';
      } else {
        statusText.textContent = 'บันทึกไม่สำเร็จ: ' + err.message;
      }
      statusText.classList.add('err');
    }
  });

  async function deleteEntry(id){
    if (!col) return;
    if (!confirm('ลบรายการนี้หรือไม่?')) return;
    try{
      await col.doc(id).delete();
    } catch(err){
      statusText.textContent = 'ลบไม่สำเร็จ: ' + err.message;
      statusText.classList.add('err');
    }
  }

  async function move(id, dir){
    if (!col) return;
    const list = visibleEntries();
    const idx = list.findIndex(x => x.id === id);
    const swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
    const a = allEntries.find(x => x.id === list[idx].id);
    const b = allEntries.find(x => x.id === list[swapIdx].id);
    const batch = db.batch();
    batch.update(col.doc(a.id), { order: b.order });
    batch.update(col.doc(b.id), { order: a.order });
    try{ await batch.commit(); } catch(err){ console.error(err); }
  }

})();
</script>
